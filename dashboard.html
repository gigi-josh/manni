<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MannieNG</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="/api/placeholder/40/40" alt="MannieNG" class="logo">
                <span>MannieNG</span>
            </div>
            <div class="nav-links">
                <span class="user-welcome">Welcome, <span id="username"></span>!</span>
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <h1>Your Dashboard</h1>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <i class="fas fa-wallet"></i>
                        <div>
                            <span class="stat-label">Balance</span>
                            <span class="stat-value" id="balance">₦0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-check-circle"></i>
                        <div>
                            <span class="stat-label">Tasks Completed</span>
                            <span class="stat-value" id="tasksCompleted">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-share-alt"></i>
                        <div>
                            <span class="stat-label">Referral Code</span>
                            <span class="stat-value" id="referralCode">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-content">
                <div class="tasks-section">
                    <h2>Available Tasks</h2>
                    <div id="tasksContainer" class="tasks-grid"></div>
                </div>

                <div class="withdraw-section">
                    <h2>Withdraw Earnings</h2>
                    <div class="withdraw-card">
                        <form id="withdrawForm">
                            <div class="form-group">
                                <label>Amount (₦)</label>
                                <input type="number" id="withdrawAmount" min="100" required placeholder="Enter amount">
                            </div>
                            <div class="form-group">
                                <label>Bank Name</label>
                                <select id="bankName" required>
                                    <option value="">Select Bank</option>
                                    <option value="GTBank">GTBank</option>
                                    <option value="Access Bank">Access Bank</option>
                                    <option value="First Bank">First Bank</option>
                                    <option value="Zenith Bank">Zenith Bank</option>
                                    <option value="UBA">UBA</option>
                                    <option value="Opay">Opay</option>
                                    <option value="PalmPay">PalmPay</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Account Number</label>
                                <input type="text" id="accountNumber" required placeholder="Enter 10-digit account number" pattern="\d{10}">
                            </div>
                            <button type="submit" class="btn btn-primary">Withdraw</button>
                        </form>
                        <div id="withdrawMessage"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
