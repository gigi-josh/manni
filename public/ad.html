    <div class="ad-page">

            <h2>Your task is loading…</h2>

            <!-- Countdown -->
            <div class="ad-countdown">
                <span id="countdown">5</span>

            <!-- Continue button (unlocks at 0) -->

                s = d.createElement('script'),
                l = d.currentScript || d.scripts[d.scripts.length - 1];

    <script>
        // ================= COUNTDOWN =================
        const params = new URLSearchParams(window.location.search);
        const taskUrl = params.get('url') || '';
        const taskId = window.location.pathname.split('/').pop();

        // Whitelist: only open http/https URLs, and only from a known set of domains (optional)
        const isSafeUrl = (u) => {
            if (!u) return false;
            try {
                const parsed = new URL(u);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch {
                return false;
            }
        };

        const destination = isSafeUrl(taskUrl) ? taskUrl : null;

        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const continueBtn = document.getElementById('continueBtn');

        const tick = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(tick);

                // Hide the countdown number, show ✅
                countdownEl.parentElement.innerHTML = '<span style="font-size: 1.3rem;">✅ Ready</span>';

                continueBtn.disabled = false;
                continueBtn.textContent = 'Continue to task';
                continueBtn.onclick = () => {
                    if (destination) {
                        window.open(destination, '_blank', 'noopener,noreferrer');
                    }
                    // Return to dashboard after opening
                    window.location.href = '/dashboard';
                };
            }
        }, 1000);
    </script>
