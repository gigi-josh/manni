<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Task… - MannieNG</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="ad-page">
        <div class="ad-card">
            <div class="ad-logo">
                <span class="logo-badge">M</span>
                <span>MannieNG</span>
            </div>

            <h2>Your task is loading…</h2>
            <p class="ad-sub">Please wait while we prepare your task. Your sponsor below makes MannieNG free for everyone.</p>

            <!-- ================= SPONSORED BANNER (300x250) ================= -->
            <div class="ad-slot-inline">
                <!-- Adsterra 300x250 banner -->
                <script>
                  atOptions = {
                    'key' : '7330eeefe6ee702d2cfca77bd8a7ce0f',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                  };
                </script>
                <script src="https://www.highrevenueformat.com/7330eeefe6ee702d2cfca77bd8a7ce0f/invoke.js"></script>
            </div>

            <!-- Countdown -->
            <div class="ad-countdown">
                <span id="countdown">5</span>
                <span>seconds</span>
            </div>

            <!-- Continue button (unlocks at 0) -->
            <button id="continueBtn" class="btn btn-primary btn-full" disabled>
                Please wait…
            </button>

            <a href="/dashboard" class="ad-back">← Back to dashboard</a>
        </div>
    </div>

    <!-- ================= ADSTERRA POPUNDER ================= -->
    <script src="https://pl31287847.profitableratecpmnetwork.com/45/6c/f2/456cf2a7c0671bb8bdb1924b6cee4621.js"></script>

    <script>
        // ================= COUNTDOWN =================
        const params = new URLSearchParams(window.location.search);
        const taskUrl = params.get('url') || '';

        // Only allow http/https URLs
        const isSafeUrl = (u) => {
            if (!u) return false;
            try {
                const parsed = new URL(u);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch {
                return false;
            }
        };

        const destination = isSafeUrl(taskUrl) ? taskUrl : null;

        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const continueBtn = document.getElementById('continueBtn');

        const tick = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(tick);

                countdownEl.parentElement.innerHTML = '<span style="font-size: 1.3rem;">✅ Ready</span>';

                continueBtn.disabled = false;
                continueBtn.textContent = 'Continue to task';
                continueBtn.onclick = () => {
                    if (destination) {
                        window.open(destination, '_blank', 'noopener,noreferrer');
                    }
                    window.location.href = '/dashboard';
                };
            }
        }, 1000);
    </script>
</body>
</html>
