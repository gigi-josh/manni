<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MannieNG</title>
    <meta name="description" content="Login to your MannieNG account and continue earning money online in Nigeria.">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-badge logo-badge-lg">M</span>
                <h1>Welcome Back</h1>
                <p>Login to continue earning with MannieNG</p>
            </div>

            <!-- 300x250 in-block banner -->
            <div class="auth-ad-slot">
                <script>
                  atOptions = {
                    'key' : '7330eeefe6ee702d2cfca77bd8a7ce0f',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                  };
                </script>
                <script src="https://www.highrevenueformat.com/7330eeefe6ee702d2cfca77bd8a7ce0f/invoke.js"></script>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="identifier">Phone Number or Email</label>
                    <input type="text"
                           id="identifier"
                           required
                           placeholder="08012345678 or you@example.com"
                           autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           required
                           placeholder="Enter your password"
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <div id="loginMessage" class="message"></div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register">Sign up</a></p>
                <p><a href="/">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <!-- ================= GROUND BANNER AD (Adsterra Native) ================= -->
    <div class="ground-banner" id="groundBanner">
        <button class="ground-banner-close"
                onclick="document.getElementById('groundBanner').remove()"
                aria-label="Close ad">
            <i class="fas fa-times"></i>
        </button>
        <div class="ground-banner-content">
            <script async="async" data-cfasync="false" src="https://pl31287853.profitableratecpmnetwork.com/a633b05ec0e98ad0555f62c7620c4b83/invoke.js"></script>
            <div id="container-a633b05ec0e98ad0555f62c7620c4b83"></div>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
