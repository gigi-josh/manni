<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MannieNG</title>
    <meta name="description" content="Create a free MannieNG account and start earning money online in Nigeria today.">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-badge logo-badge-lg">M</span>
                <h1>Create Account</h1>
                <p>Start earning money online in Nigeria today</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           required
                           placeholder="Choose a username"
                           autocomplete="username"
                           minlength="3"
                           maxlength="30">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           required
                           placeholder="you@example.com"
                           autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel"
                           id="phone"
                           required
                           placeholder="08012345678"
                           autocomplete="tel"
                           maxlength="14"
                           inputmode="numeric">
                    <small>Enter a valid Nigerian phone number (e.g. 08012345678)</small>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           required
                           placeholder="Create a strong password"
                           minlength="6"
                           autocomplete="new-password">
                    <small>Minimum 6 characters</small>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Register Now</button>
            </form>

            <div id="registerMessage" class="message"></div>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Login</a></p>
                <p><a href="/">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <!-- ================= GROUND BANNER AD ================= -->
    <div class="ground-banner" id="groundBanner">
        <button class="ground-banner-close"
                onclick="document.getElementById('groundBanner').remove()"
                aria-label="Close ad">
            <i class="fas fa-times"></i>
        </button>
        <div class="ground-banner-content">
            <!--
                REPLACE with your real ad code:

                <a href="https://your-advertiser-link.com" target="_blank" rel="noopener">
                    <img src="https://your-ad-network.com/banner-728x90.jpg"
                         alt="Advertisement"
                         class="ground-banner-img">
                </a>
            -->
            <div class="ground-banner-placeholder">
                <i class="fas fa-bullhorn"></i>
                <span>Ad Space — Ground Banner (728×90)</span>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
